name: Auto Update Playlist

on:
  workflow_dispatch:
  
jobs:
  scrape-live-matches:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Public Repository
        uses: actions/checkout@v4

      - name: 🔐 Checkout Private Scraper Repository
        uses: actions/checkout@v4
        with:
          repository: srhady/Sports
          token: ${{ secrets.PAT_TOKEN }}
          path: private_script_folder

      - name: 🗄️ Checkout Private Storage Repository
        uses: actions/checkout@v4
        with:
          repository: srhady/bingstream-srt
          token: ${{ secrets.PAT_TOKEN }}
          path: storage_dir

      - name: 📁 Checkout VIP Repository
        uses: actions/checkout@v4
        with:
          repository: srhady/axsports
          token: ${{ secrets.PAT_TOKEN }}
          path: axsports

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Caching Node Modules to reduce execution time
      - name: ⚡ Cache Node Modules
        uses: actions/cache@v4
        id: cache-npm
        with:
          path: node_modules
          key: ${{ runner.os }}-node-cheerio

      # Skip npm install if cache is successfully hit
      - name: 📦 Install Dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm install cheerio

      - name: 🚀 Run Scraper
        run: node private_script_folder/scraper.js

      - name: 💾 Push to Storage Repository
        run: |
          cd storage_dir
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto updated streams and cleaned dead files" || echo "No changes to commit"
          git push origin main

      - name: 🕒 Update BD Time in README
        run: |
          CUR_TIME=$(TZ='Asia/Dhaka' date +'%I:%M %p, %d %b %Y')
          sed -i "s|last--commit--time-.*-blue|last--commit--time-${CUR_TIME// /%20}-blue|g" README.md

      - name: 💾 Push to Public GitHub (Bingstream)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u || true
          git add playlist.json || true
          git add README.md || true
          git commit -m "Auto Update Playlist & BD Time: $(TZ='Asia/Dhaka' date +'%I:%M %p')" || echo "No changes to commit"
          git pull --rebase --autostash origin main
          git push

      - name: 💎 Push VIP Playlist to Axsports
        run: |
          cd axsports
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u || true
          git add live_sports.json || true
          git commit -m "Auto Update VIP Playlist: $(TZ='Asia/Dhaka' date +'%I:%M %p')" || echo "No changes to commit"
          git pull --rebase --autostash origin main || true
          git push
